      text: 60
      movie_image: 25
      chat_quote: 15
    answer_timeout_seconds: 90
    webhook_name: Observador
    webhook_avatar_path: Assets/Observador.png
    archives:
      enabled: true
      cache_directory: cache/observer_archives
      max_message_length: 500
      preview_timeout_seconds: 300
    difficulty_defaults:
      easy:
        reward_count: 2
        allow_baskets: false
      medium:
        reward_count: 3
        allow_baskets: true
      hard:
        reward_count: 3
        allow_baskets: true
    reward_pool:
      candies:
        grant_type: currency
        grant_id: candies
        min_amount: 30
        max_amount: 70
      xp_bank:
        grant_type: currency
        grant_id: xp_bank
        min_amount: 30
        max_amount: 80
      trick_coins:
        grant_type: currency
        grant_id: trick_coins
        min_amount: 6
        max_amount: 16
      dice_count:
        grant_type: currency
        grant_id: dice_count
        min_amount: 1
        max_amount: 2
      baskets:
        grant_type: item
        grant_id: cesta_abobora
        amount: 1
      trick_item:
        grant_type: item_random
        item_ids:
        - mute
        - switch
        - interferencia
        amount: 1
  # Chuva de Doces (nome interno antigo no banco: spider).
