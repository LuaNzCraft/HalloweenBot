# Halloween Bot - configuracao central
#
# Edite este arquivo e use /setup recarregar_config para aplicar as mudancas.
# Perguntas, traducoes e missoes extensas continuam na pasta content/.
# IDs de canais e cargos configurados por servidor continuam no SQLite.

config_version: 1

# Valores iniciais. Canais e cargos alterados com /setup ficam salvos por servidor no SQLite.
guild_defaults:
  leaderboard_channel_id: null
  log_channel_id: null
  event_channel_ids: []
  julgamento_channel_id: null
  julgamento_thread_id: null
  julgamento_base_message_id: null
  shop_role_id: null
  board_100_role_id: null
  notification_role_id: null
  cinefilo_role_id: null
  julgamento_active_role_id: null
  julgamento_muted_role_id: null
  julgamento_spectator_role_id: null
# Conquistas e marcos permanentes do evento.
achievements:
  cinefilo_correct_answers_required: 50
  generosity_candies_milestones:
  - target: 140
    rewards:
      cesta_abobora: 1
  - target: 420
    rewards:
      cesta_abobora: 2
      cesta_doce_epica: 1
  - target: 840
    rewards:
      cesta_doce_epica: 2
      cesta_doce_amaldicoada: 1
  - target: 1400
    rewards:
      cesta_doce_epica: 3
      cesta_doce_amaldicoada: 2
# Duracao e comportamento dos itens de travessura.
effects:
  mute_duration_seconds: 60
  # Administradores nao podem receber timeout do Discord. Quando ativo, o bot
  # apaga as novas mensagens deles durante o mute (requer Gerenciar Mensagens).
  admin_mute_delete_messages: true
  interference_duration_seconds: 600
  switch_duration_seconds: 900
  switch_nickname_pool:
  - Vampiro Vegano
  - Pulguento
  - Morcego Calvo
  - Abobora Amassada
  - Lacaio de {actor_name}
  - Servo de {actor_name}
  - Mascote de {actor_name}
  - Mini Monstro
  - Fantasma do RH
  - Criatura de Quintal
# Regras do pedido publico de Doce ou Travessura.
profile_requests:
  candy_amount: 10
  trick_coins_amount: 5
  daily_requests_per_pair: 1
  request_timeout_seconds: 1800
  active_window_minutes: 30
  ignore_cooldown_seconds: 180
# Trem Fantasma: bonus coletivo disparado pelo movimento do chat.
chat_bonus:
  enabled: true
  threshold_messages: 100
  window_minutes: 10
  min_message_length: 3
  button_timeout_seconds: 30
  options:
  - id: candies
    label: Doces
    emoji: <:sweetcoins:1496365065773781033>
    rewards:
    - grant_type: currency
      grant_id: candies
      amount: 30
  - id: tricks
    label: Travessuras
    emoji: <:trickcoins:1496364971398008932>
    rewards:
    - grant_type: currency
      grant_id: trick_coins
      amount: 30
# Caça aos Doces: disputa curta com uma tentativa por jogador.
chat_candy:
  enabled: true
  emoji_ids:
  - 1496905501349515476
  - 1496905441488277574
  - 1496905835237085245
  - 1496906705219617030
  spawn_chance_percent: 60
  spawn_cooldown_seconds: 30
  capture_seconds: 15
  min_message_length: 3
  min_options: 3
  max_options: 4
  reward_candies: 1
  max_spawns_per_day: 150
  pause_during_public_events: true
