    enabled: true
    interval_minutes: 60
    julgamento_daily_times:
    - '13:00'
    - '19:00'
    - '21:00'
    announce_minutes_before: 1
    pause_after_hour: 0
    resume_hour: 8
  # Perguntas, proporcao de imagens e recompensas do Observador.
  observer:
    enabled: true
    question_source: content/halloween/observer_questions.json
    question_sources:
    - content/halloween/observer_questions.json
    - content/halloween/observer_movie_questions.json
